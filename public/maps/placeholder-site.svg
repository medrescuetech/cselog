<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1400" viewBox="0 0 2000 1400" font-family="Helvetica, Arial, sans-serif">
  <!-- PLACEHOLDER SITE PLAN -->
  <!-- Replace this file with the real site survey/GIS image via Admin > Maps. -->
  <!-- Pin coordinates are stored in this image's pixel space (2000 x 1400).   -->
  <defs>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0 L0 0 0 100" fill="none" stroke="#dfe4e8" stroke-width="1"/>
    </pattern>
    <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#c9d4dd" stroke-width="5"/>
    </pattern>
  </defs>

  <rect width="2000" height="1400" fill="#f4f7f9"/>
  <rect width="2000" height="1400" fill="url(#grid)"/>

  <!-- site boundary -->
  <path d="M80 80 H1920 V1320 H80 Z" fill="none" stroke="#8a97a3" stroke-width="6" stroke-dasharray="26 14"/>

  <!-- roads -->
  <path d="M80 700 H1920" stroke="#cfd8de" stroke-width="56" fill="none"/>
  <path d="M700 80 V1320" stroke="#cfd8de" stroke-width="48" fill="none"/>
  <path d="M1400 700 V1320" stroke="#cfd8de" stroke-width="40" fill="none"/>
  <path d="M80 700 H1920" stroke="#ffffff" stroke-width="3" stroke-dasharray="30 26"/>
  <path d="M700 80 V1320" stroke="#ffffff" stroke-width="3" stroke-dasharray="30 26"/>

  <!-- tank farm -->
  <rect x="820" y="140" width="720" height="440" rx="10" fill="#e8eef3" stroke="#9fb0bd" stroke-width="3"/>
  <text x="840" y="180" font-size="30" fill="#5a6b78" letter-spacing="2">TANK FARM</text>
  <circle cx="960" cy="330" r="95" fill="#ffffff" stroke="#7f8f9c" stroke-width="4"/>
  <text x="960" y="340" font-size="26" fill="#5a6b78" text-anchor="middle">T-301</text>
  <circle cx="1180" cy="330" r="95" fill="#ffffff" stroke="#7f8f9c" stroke-width="4"/>
  <text x="1180" y="340" font-size="26" fill="#5a6b78" text-anchor="middle">T-302</text>
  <circle cx="1400" cy="330" r="95" fill="#ffffff" stroke="#7f8f9c" stroke-width="4"/>
  <text x="1400" y="340" font-size="26" fill="#5a6b78" text-anchor="middle">T-303</text>
  <rect x="860" y="470" width="640" height="70" fill="url(#hatch)" stroke="#9fb0bd" stroke-width="2"/>
  <text x="880" y="515" font-size="22" fill="#5a6b78">BUND / SPILL CONTAINMENT</text>

  <!-- process plant -->
  <rect x="180" y="160" width="420" height="420" rx="8" fill="#e8eef3" stroke="#9fb0bd" stroke-width="3"/>
  <text x="200" y="200" font-size="30" fill="#5a6b78" letter-spacing="2">PROCESS PLANT</text>
  <rect x="220" y="240" width="160" height="140" fill="#ffffff" stroke="#7f8f9c" stroke-width="3"/>
  <text x="300" y="315" font-size="22" fill="#5a6b78" text-anchor="middle">SILO 1</text>
  <rect x="410" y="240" width="160" height="140" fill="#ffffff" stroke="#7f8f9c" stroke-width="3"/>
  <text x="490" y="315" font-size="22" fill="#5a6b78" text-anchor="middle">SILO 2</text>
  <rect x="220" y="410" width="350" height="130" fill="#ffffff" stroke="#7f8f9c" stroke-width="3"/>
  <text x="395" y="485" font-size="22" fill="#5a6b78" text-anchor="middle">PUMP HOUSE</text>

  <!-- ponds -->
  <ellipse cx="380" cy="1020" rx="230" ry="150" fill="#dce9f2" stroke="#8fb3cc" stroke-width="4"/>
  <text x="380" y="1030" font-size="28" fill="#54748c" text-anchor="middle">SETTLEMENT POND</text>
  <circle cx="240" cy="880" r="26" fill="#ffffff" stroke="#54748c" stroke-width="4"/>
  <text x="240" y="838" font-size="20" fill="#54748c" text-anchor="middle">SUMP 4</text>

  <!-- yard / laydown -->
  <rect x="800" y="820" width="520" height="380" rx="8" fill="#eef1ee" stroke="#a9b6a9" stroke-width="3"/>
  <text x="820" y="862" font-size="30" fill="#5f6e5f" letter-spacing="2">LAYDOWN YARD</text>
  <rect x="840" y="900" width="200" height="120" fill="#ffffff" stroke="#8b9a8b" stroke-width="3"/>
  <text x="940" y="970" font-size="22" fill="#5f6e5f" text-anchor="middle">STORES</text>
  <circle cx="1180" cy="1080" r="30" fill="#ffffff" stroke="#8b9a8b" stroke-width="4"/>
  <text x="1180" y="1140" font-size="20" fill="#5f6e5f" text-anchor="middle">PIT 12</text>

  <!-- workshop / admin -->
  <rect x="1520" y="820" width="340" height="240" rx="8" fill="#e8eef3" stroke="#9fb0bd" stroke-width="3"/>
  <text x="1540" y="862" font-size="28" fill="#5a6b78">WORKSHOP</text>
  <rect x="1520" y="1100" width="340" height="140" rx="8" fill="#e8eef3" stroke="#9fb0bd" stroke-width="3"/>
  <text x="1540" y="1180" font-size="28" fill="#5a6b78">ADMIN / CONTROL</text>

  <!-- gate & weighbridge -->
  <rect x="120" y="660" width="70" height="80" fill="#ffffff" stroke="#7f8f9c" stroke-width="4"/>
  <text x="155" y="640" font-size="22" fill="#5a6b78" text-anchor="middle">GATE 1</text>
  <rect x="300" y="640" width="180" height="60" fill="#ffffff" stroke="#7f8f9c" stroke-width="3"/>
  <text x="390" y="680" font-size="20" fill="#5a6b78" text-anchor="middle">WEIGHBRIDGE</text>

  <!-- muster point -->
  <circle cx="1720" cy="620" r="34" fill="#ffffff" stroke="#1f9d55" stroke-width="6"/>
  <text x="1720" y="700" font-size="22" fill="#1f9d55" text-anchor="middle">MUSTER A</text>

  <!-- north arrow + scale -->
  <g transform="translate(1840,170)">
    <path d="M0 -70 L26 40 L0 16 L-26 40 Z" fill="#5a6b78"/>
    <text x="0" y="76" font-size="28" fill="#5a6b78" text-anchor="middle">N</text>
  </g>
  <g transform="translate(120,1250)">
    <rect x="0" y="0" width="200" height="12" fill="#5a6b78"/>
    <rect x="0" y="0" width="100" height="12" fill="#ffffff" stroke="#5a6b78" stroke-width="2"/>
    <text x="0" y="40" font-size="22" fill="#5a6b78">0</text>
    <text x="190" y="40" font-size="22" fill="#5a6b78">100 m (indicative)</text>
  </g>

  <text x="1000" y="1360" font-size="26" fill="#98a6b2" text-anchor="middle">
    PLACEHOLDER SITE PLAN — replace in Admin › Maps with the real survey image
  </text>
</svg>
