name: CI & Quality Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  test:
    name: PHPUnit & Feature Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: csem_test
          MYSQL_USER: csem
          MYSQL_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, sqlite3, pdo_sqlite, pdo_mysql, bcmath, gd, zip
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment (SQLite)
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate
          php artisan migrate:fresh --seed
          php artisan sitemap:import

      - name: Run PHPUnit Test Suite
        run: php artisan test

      - name: Verify MySQL Compatibility
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: csem_test
          DB_USERNAME: csem
          DB_PASSWORD: secret
        run: |
          php artisan migrate:fresh --seed --force
          php artisan sitemap:import

  browser-acceptance:
    name: Playwright Map Acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Setup Application
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate
          php artisan migrate:fresh --seed
          php artisan sitemap:import

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright & Browsers
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Start Laravel test server
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > storage/logs/browser-test-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/login >/dev/null 2>&1; then
              echo "Server ready"
              break
            fi
            sleep 1
          done

      - name: Run Playwright tests
        env:
          APP_URL: http://127.0.0.1:8000
        run: npm run test:browser

      - name: Upload screenshots & reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            test-results/
            playwright-report/
            storage/logs/browser-test-server.log
          retention-days: 7
