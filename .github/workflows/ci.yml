name: CI and Visual Map Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  laravel-and-visual-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite, gd
          coverage: none

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PHP Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Environment Setup
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate:fresh --seed --force

      - name: Run PHPUnit Tests
        run: php artisan test

      - name: Install Python Playwright Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps

      - name: Start Laravel Application
        run: |
          php artisan serve --port=8000 &
          sleep 3

      - name: Run Playwright Visual Map Tests
        env:
          BASE_URL: http://127.0.0.1:8000
          SCREENSHOT_DIR: ${{ github.workspace }}/screenshots
          VIDEO_DIR: ${{ github.workspace }}/videos
        run: |
          python tests/Browser/test_map_visual.py

      - name: Upload Visual Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-visual-artifacts
          path: |
            ${{ github.workspace }}/screenshots/
            ${{ github.workspace }}/videos/
          if-no-files-found: ignore
