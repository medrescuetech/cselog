name: Visual map acceptance

on:
  push:
    branches:
      - "fix/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-portability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - driver: mysql
            image: mysql:8.4
            health-cmd: mysqladmin ping -h 127.0.0.1 -proot
          - driver: mariadb
            image: mariadb:11.4
            health-cmd: healthcheck.sh --connect --innodb_initialized
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hwrt
          MYSQL_USER: hwrt
          MYSQL_PASSWORD: hwrt-test-password
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: hwrt
          MARIADB_USER: hwrt
          MARIADB_PASSWORD: hwrt-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.health-cmd }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql
          coverage: none

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Configure MySQL-compatible application database
        run: |
          cp .env.example .env
          sed -i "s/^APP_ENV=.*/APP_ENV=testing/; s/^DB_CONNECTION=.*/DB_CONNECTION=${{ matrix.driver }}/" .env
          {
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=3306"
            echo "DB_DATABASE=hwrt"
            echo "DB_USERNAME=hwrt"
            echo "DB_PASSWORD=hwrt-test-password"
            echo "SESSION_DRIVER=database"
            echo "CACHE_STORE=database"
            echo "QUEUE_CONNECTION=database"
          } >> .env
          php artisan key:generate
          php artisan migrate --path=database/migrations/0001_01_01_000000_create_users_table.php --force
          php artisan migrate --path=database/migrations/0001_01_01_000001_create_cache_table.php --force
          php artisan migrate --path=database/migrations/0001_01_01_000002_create_jobs_table.php --force
          php artisan migrate --path=database/migrations/2026_09_21_000001_create_csem_tables.php --force
          php tests/Support/migration-upgrade-rehearsal.php prepare
          php artisan migrate --force
          php artisan hwrt:bootstrap-admin
          php tests/Support/migration-upgrade-rehearsal.php verify
          mkdir -p storage/app/hwrt-sitemap/versions/ci
          cp -a sitemap/. storage/app/hwrt-sitemap/versions/ci/
          ln -s versions/ci storage/app/hwrt-sitemap/current
          echo "HWRT_SITEMAP_PATH=$GITHUB_WORKSPACE/storage/app/hwrt-sitemap/current" >> .env
          php artisan sitemap:import

      - name: Run feature and unit tests on ${{ matrix.driver }}
        run: php artisan test

  map-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build local frontend assets
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Configure application
        run: |
          cp .env.example .env
          touch database/database.sqlite
          mkdir -p storage/app/hwrt-sitemap/versions/ci
          cp -a sitemap/. storage/app/hwrt-sitemap/versions/ci/
          ln -s versions/ci storage/app/hwrt-sitemap/current
          echo "HWRT_SITEMAP_PATH=$GITHUB_WORKSPACE/storage/app/hwrt-sitemap/current" >> .env
          php artisan key:generate
          php artisan migrate:fresh --seed
          php artisan sitemap:import

      - name: Run PHPUnit
        run: php artisan test

      - name: Install browser test dependencies
        run: |
          npx playwright install --with-deps chromium

      - name: Start Laravel test server
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > storage/logs/browser-test-server.log 2>&1 &
          echo $! > /tmp/csem-server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/login >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat storage/logs/browser-test-server.log
          exit 1

      - name: Run visible map acceptance tests
        env:
          APP_URL: http://127.0.0.1:8000
        run: npm run test:browser

      - name: Upload map screenshots and browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-visual-acceptance
          path: |
            test-results/
            playwright-report/
            storage/logs/browser-test-server.log
          if-no-files-found: warn
          retention-days: 14
